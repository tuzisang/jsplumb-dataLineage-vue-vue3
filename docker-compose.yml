services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8620}:80"
    environment:
      - cors_origin=${CORS_ORIGIN:-http://localhost:8620}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datalineage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=server.py
      - PORT=5000
      - HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - datalineage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  datalineage-network:
    driver: bridge