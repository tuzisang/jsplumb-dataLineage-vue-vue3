version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - NGINX_HOST=frontend
      - NGINX_PORT=80
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - datalineage-network

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=server.py
    volumes:
      - ./api:/app
    restart: unless-stopped
    networks:
      - datalineage-network

networks:
  datalineage-network:
    driver: bridge